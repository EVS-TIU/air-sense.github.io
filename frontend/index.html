<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AirSense — check the weather and air quality for any city."
    />
    <title>AirSense | Weather &amp; Air Quality</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="/">AirSense</a>
    </header>

    <main id="app">
      <section class="hero">
        <h1>Weather &amp; air quality, at a glance</h1>
        <p>Search for a city to see the current conditions.</p>

        <form id="search-form" class="search-form" autocomplete="off">
          <label class="sr-only" for="city-input">City</label>
          <input
            id="city-input"
            name="city"
            type="search"
            placeholder="Enter a city…"
            required
          />
          <button type="submit">Search</button>
        </form>
      </section>

      <section id="results" class="results" aria-live="polite"></section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> AirSense</p>
    </footer>

    <script src="js/app.js" defer></script>
  </body>
</html>
