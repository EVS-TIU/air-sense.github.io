<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirSense - Weather Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">

    <!-- Forecast Hourly component styles (Roshan) -->
    <link rel="stylesheet" href="./css/forecast-hourly.css">
</head>
<body>

    <div class="dashboard">

        <!-- Top Navigation -->
        <header class="topbar panel" aria-label="Top navigation"></header>

        <!-- Sidebar -->
        <aside class="sidebar panel" aria-label="Dashboard navigation"></aside>

        <!-- Current Weather -->
        <section class="current-weather panel" aria-label="Current Weather"></section>

        <!-- Forecast Hourly (Roshan) -->
        <section class="hourly-forecast" aria-labelledby="hourly-forecast-title">
            <div class="forecast-header">
                <div class="forecast-title">
                    <svg viewBox="0 0 24 24" class="clock-icon" aria-hidden="true">
                        <circle cx="12" cy="12" r="9.5"/>
                        <path d="M12 6.5V12L16 14.5"/>
                    </svg>
                    <h2 id="hourly-forecast-title">Forecast Hourly</h2>
                </div>

                <a href="#" class="view-more">
                    View More
                    <span aria-hidden="true">→</span>
                </a>
            </div>

            <div class="hourly-cards">

                <div class="hour-card active">
                    <p class="hour">9 AM</p>

                    <svg class="weather-icon rain" viewBox="0 0 80 65" aria-hidden="true">
                        <path class="cloud"
                            d="M18 39 C5 39 4 22 16 17
                            C18 5 37 3 43 17
                            C58 9 73 22 69 35
                            C67 41 62 43 55 43
                            H18Z"/>
                        <path class="rain-drop" d="M22 48 L17 58"/>
                        <path class="rain-drop" d="M39 48 L34 60"/>
                        <path class="rain-drop" d="M56 48 L51 58"/>
                    </svg>

                    <h3>19°</h3>
                    <p class="humidity"><span>♢</span> 85%</p>
                </div>

                <div class="hour-card">
                    <p class="hour">12 PM</p>

                    <svg class="weather-icon rain" viewBox="0 0 80 65" aria-hidden="true">
                        <path class="cloud"
                            d="M18 39 C5 39 4 22 16 17
                            C18 5 37 3 43 17
                            C58 9 73 22 69 35
                            C67 41 62 43 55 43
                            H18Z"/>
                        <path class="rain-drop" d="M22 48 L17 58"/>
                        <path class="rain-drop" d="M39 48 L34 60"/>
                        <path class="rain-drop" d="M56 48 L51 58"/>
                    </svg>

                    <h3>21°</h3>
                    <p class="humidity"><span>♢</span> 70%</p>
                </div>

                <div class="hour-card">
                    <p class="hour">3 PM</p>

                    <svg class="weather-icon" viewBox="0 0 80 65" aria-hidden="true">
                        <path class="cloud"
                            d="M18 42 C5 42 4 26 16 20
                            C18 8 37 6 43 20
                            C58 12 73 25 69 38
                            C67 44 62 46 55 46
                            H18Z"/>
                    </svg>

                    <h3>23°</h3>
                    <p class="humidity"><span>♢</span> 40%</p>
                </div>

                <div class="hour-card">
                    <p class="hour">6 PM</p>

                    <svg class="weather-icon rain" viewBox="0 0 80 65" aria-hidden="true">
                        <path class="cloud"
                            d="M18 39 C5 39 4 22 16 17
                            C18 5 37 3 43 17
                            C58 9 73 22 69 35
                            C67 41 62 43 55 43
                            H18Z"/>
                        <path class="rain-drop" d="M22 48 L17 58"/>
                        <path class="rain-drop" d="M39 48 L34 60"/>
                        <path class="rain-drop" d="M56 48 L51 58"/>
                    </svg>

                    <h3>20°</h3>
                    <p class="humidity"><span>♢</span> 65%</p>
                </div>

                <div class="hour-card">
                    <p class="hour">9 PM</p>

                    <svg class="weather-icon" viewBox="0 0 80 65" aria-hidden="true">
                        <path class="cloud"
                            d="M18 42 C5 42 4 26 16 20
                            C18 8 37 6 43 20
                            C58 12 73 25 69 38
                            C67 44 62 46 55 46
                            H18Z"/>
                    </svg>

                    <h3>18°</h3>
                    <p class="humidity"><span>♢</span> 30%</p>
                </div>

                <div class="hour-card">
                    <p class="hour">12 AM</p>

                    <div class="moon-icon" aria-hidden="true">🌙</div>

                    <h3>16°</h3>
                    <p class="humidity"><span>♢</span> 20%</p>
                </div>

            </div>
        </section>

        <!-- Additional Weather Details -->
        <section class="weather-details" aria-label="Additional Weather Details">
            <div class="weather-info"></div>
            <div class="sun-panel"></div>
        </section>

        <!-- 7 Days Weather -->
        <section class="week-forecast panel" aria-label="7 Days Weather"></section>

    </div>

</body>
</html>
